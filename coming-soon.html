<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon · AVI International</title>

  <!-- ── SECURITY HEADERS ── -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  

  <style>
    /* ── exact same CSS as index (palette only) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --saffron:    #E8821A;
      --saffron-2:  #F5A54A;
      --saffron-bg: #FFF4E8;
      --green:      #138808;
      --green-2:    #1FAD0A;
      --green-bg:   #EEF7EC;
      --white:      #FFFFFF;
      --cream:      #FDFAF4;
      --cream-2:    #F7F0E3;
      --gold:       #C9A227;
      --gold-soft:  #E8C766;
      --ink:        #1A1A1A;
      --ink-2:      #3D2B1A;
      --muted:      #6B5A4A;
      --border:     rgba(232,130,26,0.18);
      --leaf:       #138808;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .hi {
      font-family: 'Noto Serif Devanagari', serif;
      font-weight: 500;
    }

    /* ── HERO (coming soon only) ── */
    .hero {
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(19,136,8,0.08) 0%, transparent 55%),
        linear-gradient(160deg, var(--saffron-bg) 0%, var(--white) 50%, var(--green-bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 40px 5vw;
      border-bottom: 4px solid var(--green);
      flex: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--saffron) 33%, var(--white) 33%, var(--white) 66%, var(--green) 66%);
      pointer-events: none;
      z-index: 3;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 80%, rgba(232,130,26,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── ANIMATED GEOMETRIC BACKGROUND ── */
    .animated-bg {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }

    /* ── FLOATING CIRCLES ── */
    .float-circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.15;
        animation: floatCircle 20s ease-in-out infinite alternate;
    }

    .float-circle:nth-child(1) {
        width: 300px;
        height: 300px;
        background: var(--saffron);
        top: -50px;
        left: -80px;
        animation-delay: 0s;
        opacity: 0.18;
    }

    .float-circle:nth-child(2) {
        width: 200px;
        height: 200px;
        background: var(--green);
        bottom: -30px;
        right: -50px;
        animation-delay: 3s;
        opacity: 0.15;
    }

    .float-circle:nth-child(3) {
        width: 150px;
        height: 150px;
        background: var(--gold);
        top: 40%;
        right: 10%;
        animation-delay: 6s;
        opacity: 0.12;
    }

    .float-circle:nth-child(4) {
        width: 100px;
        height: 100px;
        background: var(--saffron);
        bottom: 30%;
        left: 15%;
        animation-delay: 9s;
        opacity: 0.2;
    }

    /* ── FLOATING DIAMONDS ── */
    .float-diamond {
        position: absolute;
        width: 40px;
        height: 40px;
        background: var(--saffron);
        opacity: 0.12;
        transform: rotate(45deg);
        animation: floatDiamond 25s ease-in-out infinite alternate;
    }

    .float-diamond:nth-child(5) {
        top: 20%;
        left: 30%;
        animation-delay: 1s;
        width: 60px;
        height: 60px;
        background: var(--gold);
        opacity: 0.1;
    }

    .float-diamond:nth-child(6) {
        bottom: 25%;
        right: 20%;
        animation-delay: 5s;
        width: 35px;
        height: 35px;
        background: var(--green);
        opacity: 0.14;
    }

    /* ── GENTLE WAVES ── */
    .animated-wave {
        position: absolute;
        left: -10%;
        right: -10%;
        height: 200px;
        border-radius: 50%;
        opacity: 0.08;
        animation: waveMove 15s ease-in-out infinite alternate;
    }

    .animated-wave:nth-child(7) {
        background: var(--saffron);
        bottom: -100px;
        animation-delay: 0s;
        opacity: 0.1;
    }

    .animated-wave:nth-child(8) {
        background: var(--green);
        bottom: -150px;
        animation-delay: 5s;
        height: 250px;
        opacity: 0.08;
    }

    /* ── KEYFRAMES ── */
    @keyframes floatCircle {
        0% { 
            transform: translate(0, 0) scale(1);
        }
        33% { 
            transform: translate(40px, -30px) scale(1.1);
        }
        66% { 
            transform: translate(-20px, 50px) scale(0.9);
        }
        100% { 
            transform: translate(30px, 20px) scale(1.05);
        }
    }

    @keyframes floatDiamond {
        0% { 
            transform: rotate(45deg) translate(0, 0);
        }
        50% { 
            transform: rotate(90deg) translate(30px, -20px);
        }
        100% { 
            transform: rotate(135deg) translate(-20px, 30px);
        }
    }

    @keyframes waveMove {
        0% {
            transform: translateX(0) scaleY(1);
        }
        25% {
            transform: translateX(5%) scaleY(1.2);
        }
        50% {
            transform: translateX(-5%) scaleY(0.8);
        }
        75% {
            transform: translateX(3%) scaleY(1.1);
        }
        100% {
            transform: translateX(0) scaleY(1);
        }
    }

    .hero-inner {
      max-width: 820px;
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: center;
      padding: 20px;
    }

    .coming-icon {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: 'Marcellus', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--ink-2);
      margin-bottom: 10px;
    }
    .hero h1 em { font-style: normal; color: var(--saffron); }

    .hero-h1-hindi {
      display: block;
      font-family: 'Yatra One', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      color: var(--green);
      letter-spacing: 0.02em;
    }

    .hero-divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--saffron), var(--green));
      margin: 20px auto;
      border-radius: 2px;
    }

    .back-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--saffron) 0%, var(--green) 100%);
      color: var(--white) !important;
      padding: 14px 34px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(19,136,8,0.25);
      transition: filter 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
      margin-top: 30px;
    }
    .back-btn:hover {
      filter: brightness(0.92);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .hero { padding: 20px 5vw; }
      .float-circle:nth-child(1) { width: 150px; height: 150px; }
      .float-circle:nth-child(2) { width: 100px; height: 100px; }
      .float-circle:nth-child(3) { width: 80px; height: 80px; }
    }
  </style>
</head>

        <div class="float-circle"></div>
        <div class="float-circle"></div>
        <div class="float-diamond"></div>
        <div class="float-diamond"></div>
        <div class="animated-wave"></div>
        <div class="animated-wave"></div>
    </div>

    <div class="hero-inner">
      <div class="coming-icon">🛍️</div>
      <h1 data-testid="hero-heading">Online Store <em>Coming Soon</em></h1>

      <div class="hero-divider"></div>
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </section>

</body>
